<main class="container" id="main"><header class="page-intro"><p class="eyebrow">Task 4 · Registration form</p><h1>Student registration</h1><p>Complete the sample form. Submission is not connected to a student information system.</p></header><form data-validate><div class="form-grid"><div class="field"><label for="full-name">Full name</label><input id="full-name" name="full-name" autocomplete="name" required></div><div class="field"><label for="registration-number">Registration number</label><input id="registration-number" name="registration-number" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field full"><label for="course">Course</label><select id="course" name="course" required><option value="" selected disabled>Select a course</option><option>CS 224L Web Technologies</option><option>Programming Fundamentals</option><option>Data Science</option><option>Statistics</option><option>Calculus</option></select></div><fieldset class="field full" style="border:0;padding:0;margin:0 0 1rem"><legend class="legend">Semester</legend><div class="choice-row"><label><input type="radio" name="semester" value="1" required> Semester 1</label><label><input type="radio" name="semester" value="2"> Semester 2</label><label><input type="radio" name="semester" value="3"> Semester 3</label><label><input type="radio" name="semester" value="4"> Semester 4</label></div></fieldset><div class="field full"><label class="check-label"><input type="checkbox" name="terms" required> I have read and agree to the terms and conditions.</label></div></div><button class="button" type="submit">Submit registration</button><p class="message" data-form-status role="status" aria-live="polite"></p></form></main><footer class="site-footer"><div class="header-inner footer-inner"><span>CS 224L · Web Technologies</span><a href="index.html">Back to home ↑</a></div></footer><script src="script.js" defer></script></body></html>
